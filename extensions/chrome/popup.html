<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imprint Capture</title><link rel="stylesheet" href="style.css"></head>
<body class="popup">
  <header class="topbar">
    <img class="logo" src="icon-48.png" width="32" height="32" alt="">
    <strong>Imprint <span>Capture</span></strong>
    <button id="settings" type="button">Settings</button>
  </header>
  <main>
    <div class="connection">
      <p id="connection" role="status">Connecting to local Imprint…</p>
      <button id="retry" type="button" hidden>Retry</button>
    </div>
    <section class="card" aria-labelledby="destination">
      <h2 id="destination">Save to</h2>
      <div class="fields">
        <label>Workspace<select id="workspace" disabled><option value="">Select workspace</option></select></label>
        <label>Project<input id="project" value="browser" maxlength="128" required form="capture-form"></label>
      </div>
    </section>
    <section class="card" aria-labelledby="capture-heading">
      <h2 id="capture-heading">Capture this tab</h2>
      <div class="actions">
        <button id="page" class="primary" type="button" disabled>Page text</button>
        <button id="selection" type="button" disabled>Selection</button>
        <button id="url" type="button" disabled>URL</button>
      </div>
      <p class="hint">Use page text for signed-in pages. Choose URL to let Imprint fetch the page directly.</p>
      <form id="capture-form" hidden>
        <div id="preview"></div>
        <button id="save" class="primary" type="submit">Save to Imprint</button>
      </form>
      <p id="feedback" role="status"></p>
    </section>
    <p id="job" role="status"></p>
    <details><summary>Coming soon</summary><p class="hint">Gmail, PDFs and attachments, Google Docs and Sheets, OCR, background capture, offline retries, and search.</p></details>
  </main>
  <script type="module" src="popup.js"></script>
</body></html>
