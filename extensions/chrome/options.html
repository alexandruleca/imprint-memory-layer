<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imprint Capture settings</title><link rel="stylesheet" href="style.css"></head>
<body class="options">
  <header class="topbar">
    <img class="logo" src="icon-48.png" width="32" height="32" alt="">
    <strong>Imprint <span>Capture</span></strong>
  </header>
  <main>
    <section class="card">
      <h1>Local connection</h1>
      <p class="hint">Imprint Capture connects automatically on port 8420. Change the address if your local service uses another port.</p>
      <form id="connect">
        <label for="base">Local Imprint address</label>
        <input id="base" type="url" value="http://127.0.0.1:8420" required disabled>
        <button class="primary" type="submit" id="save" disabled>Check and save</button>
      </form>
      <p id="feedback" role="status"></p>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body></html>
