name: Dev Release

on:
  push:
    branches: [dev]

concurrency:
  group: dev-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          LAST_STABLE=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$LAST_STABLE" ]; then LAST_STABLE="v0.0.0"; fi
          VERSION="${LAST_STABLE}-dev.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed dev version: $VERSION"

  build-release:
    needs: prepare
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      prerelease: true
      publish: true
    secrets: inherit
