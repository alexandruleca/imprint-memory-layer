name: Build release artifacts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      prerelease:
        default: false
        type: boolean
      publish:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed (build only; does not publish)
        default: v0.0.0-test
        required: true
        type: string

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - name: Require main or dev for release packaging
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          case "$SOURCE_REF" in
            refs/heads/main | refs/heads/dev) ;;
            *)
              echo '::error::Release artifacts are built only from main (stable) and dev (prereleases). Use CI for branch compile/test checks.'
              exit 1
              ;;
          esac

  voice-engines:
    needs: branch-policy
    uses: ./.github/workflows/voice-engine.yml

  chrome-extension:
    needs: branch-policy
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_chrome_extension_package.py' -v
      - run: node --test extensions/chrome/tests/*.test.js
      - run: npm ci --prefix imprint/ui
      # Self-hosted images lack Chromium's runtime libraries (ADR 0112).
      - run: npx playwright install --with-deps chromium
        working-directory: imprint/ui
        timeout-minutes: 60
      - run: python scripts/package_chrome_extension.py
      - run: node extensions/chrome/tests/browser-smoke.mjs dist/imprint-chrome-extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/imprint-chrome-extension.zip
          if-no-files-found: error

  dashboard:
    needs: branch-policy
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make dashboard-build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: imprint/ui/out/
          if-no-files-found: error

  electron-linux:
    needs: branch-policy
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FUSE2
        run: sudo apt-get install -y libfuse2
      - name: Build Linux AppImage
        run: make ui-dist-linux ARCH=${{ matrix.arch }}
      - name: Verify packaged preload and navigation
        run: |
          UNPACKED=linux-unpacked
          if [ '${{ matrix.arch }}' = arm64 ]; then UNPACKED=linux-arm64-unpacked; fi
          node ui-electron/node_modules/@electron/asar/bin/asar.js list "dist/electron/$UNPACKED/resources/app.asar" > /tmp/asar-files
          grep -Fx /preload.js /tmp/asar-files
          grep -Fx /navigation.js /tmp/asar-files
          grep -Fx /service.js /tmp/asar-files
          grep -Fx /companion.js /tmp/asar-files
          grep -Fx /runtime.js /tmp/asar-files
          grep -Fx /activity.js /tmp/asar-files
          grep -Fx /startup.html /tmp/asar-files
          grep -Fx /startup.css /tmp/asar-files
          grep -Fx /startup.js /tmp/asar-files
      - uses: actions/upload-artifact@v4
        with:
          name: electron-linux-${{ matrix.arch }}
          path: build/electron/linux-${{ matrix.arch }}/imprint-ui

  electron-macos:
    needs: branch-policy
    runs-on: [self-hosted, macOS, ARM64, imprint-apple-silicon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build macOS Apple silicon app
        run: make ui-dist-mac
      - name: Archive .app bundle (tar preserves symlinks)
        # Do not serialize AppleDouble/xattrs into the Linux packaging job.
        run: COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -czf build/electron/imprint-ui.app.tar.gz -C build/electron imprint-ui.app
      - uses: actions/upload-artifact@v4
        with:
          name: electron-macos
          path: build/electron/imprint-ui.app.tar.gz

  electron-windows:
    needs: branch-policy
    runs-on: [self-hosted, windows, x64, imprint-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Windows portable
        shell: bash
        run: |
          cd ui-electron
          npm ci --prefer-offline
          npx electron-builder --win portable --x64 --publish never
          mkdir -p ../build/electron
          EXE=$(find ../dist/electron -maxdepth 1 -name '*.exe' | head -1)
          cp "$EXE" ../build/electron/imprint-ui.exe
      - uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: build/electron/imprint-ui.exe

  archives:
    needs: [dashboard, electron-linux, electron-macos, electron-windows, chrome-extension, voice-engines]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: rm -rf imprint/ui/out
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: imprint/ui/out/
      - uses: actions/download-artifact@v4
        with:
          name: electron-linux-amd64
          path: build/electron/linux-amd64/
      - uses: actions/download-artifact@v4
        with:
          name: electron-linux-arm64
          path: build/electron/linux-arm64/
      - uses: actions/download-artifact@v4
        with:
          name: electron-macos
          path: build/electron/
      - uses: actions/download-artifact@v4
        with:
          name: electron-windows
          path: build/electron/

      - uses: actions/download-artifact@v4
        with:
          pattern: voice-engine-*
          path: build/voice/

      - name: Unpack macOS .app bundle
        run: |
          tar xzf build/electron/imprint-ui.app.tar.gz -C build/electron/
          rm build/electron/imprint-ui.app.tar.gz

      - name: Fix Electron permissions
        run: chmod +x build/electron/linux-*/imprint-ui

      - name: Build all platforms
        env:
          VERSION: ${{ inputs.version }}
        run: make all

      - name: Package per-platform archives
        env:
          VERSION: ${{ inputs.version }}
        run: REQUIRE_ELECTRON=1 REQUIRE_VOICE_ENGINE=1 make package

      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  package-windows:
    needs: archives
    runs-on: [self-hosted, windows, x64, imprint-windows]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/

      - name: Extract release archive
        shell: pwsh
        run: |
          Expand-Archive -Path dist\imprint-windows-amd64.zip -DestinationPath dist -Force

      - name: Reuse the bundled desktop icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Path installers\windows\assets -Force | Out-Null
          $exe = (Resolve-Path dist\imprint-windows-amd64\bin\imprint-ui.exe).Path
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          $stream = [System.IO.File]::Create((Join-Path $PWD 'installers\windows\assets\imprint.ico'))
          try { $icon.Save($stream) } finally { $stream.Dispose(); $icon.Dispose() }

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ver = $env:VERSION.TrimStart('v')
          $src = Resolve-Path dist\imprint-windows-amd64
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
              /DImprintVersion=$ver `
              /DImprintSource=$src `
              /O"$(Resolve-Path dist)" `
              installers\windows\imprint.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Smoke test silent install in a path with spaces
        timeout-minutes: 60
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'Imprint install smoke'
          $installer = (Resolve-Path dist/imprint-windows-amd64-setup.exe).Path
          $log = Join-Path $env:RUNNER_TEMP 'imprint-installer.log'
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"", "/DIR=`"$dest`"") -PassThru
          try {
            if (-not $process.WaitForExit(900000)) {
              taskkill /PID $process.Id /T /F
              throw 'Silent installer exceeded the 15 minute deadline'
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
            if (-not (Test-Path "$dest/.setup-result")) { throw 'Installer produced no setup result' }
            if ((Get-Content "$dest/.setup-result").Trim() -ne '0') { throw 'First-run setup failed' }
          } finally {
            foreach ($file in @($log, "$dest/first-run.log")) {
              if (Test-Path $file) { Write-Host "Log: $file"; Get-Content $file -Tail 100 }
            }
          }
          $env:PYTHONPATH = $dest
          & "$dest/.venv/Scripts/python.exe" scripts/smoke-runtime.py --with-embeddings
          if ($LASTEXITCODE -ne 0) { throw 'Runtime smoke failed' }
      - name: Smoke test native uninstall stops Imprint, removes it and disconnects clients
        timeout-minutes: 60
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'Imprint install smoke'
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'Imprint disposable Codex profile'
          New-Item -ItemType Directory -Path $env:CODEX_HOME -Force | Out-Null
          $command = (Join-Path $dest '.venv/Scripts/python.exe') | ConvertTo-Json -Compress
          @('model = "fixture"', '[mcp_servers.imprint]', "command = $command", '[mcp_servers.other]', 'command = "keep-other"') |
            Set-Content "$env:CODEX_HOME/config.toml" -Encoding utf8NoBOM
          @('Keep my rules.', '<!-- imprint:begin -->', 'Imprint fixture', '<!-- imprint:end -->') |
            Set-Content "$env:CODEX_HOME/AGENTS.md" -Encoding utf8NoBOM
          '{"hooks":{"Stop":[{"hooks":[{"command":"imprint/hook_entry.py stop"},{"command":"keep-hook"}]}]}}' |
            Set-Content "$env:CODEX_HOME/hooks.json" -Encoding utf8NoBOM
          'remove memories' | Set-Content "$dest/data/uninstall-probe.txt"
          $desktopProfile = Join-Path $env:APPDATA 'imprint-ui'
          New-Item -ItemType Directory -Path $desktopProfile -Force | Out-Null
          '{}' | Set-Content "$desktopProfile/echo-window.json"
          # Stands in for an MCP server a client started from the venv.
          $server = Start-Process "$dest/.venv/Scripts/python.exe" -ArgumentList @('-c', '"import time; time.sleep(600)"') -PassThru -WindowStyle Hidden
          $null = $server.Handle
          $log = Join-Path $env:RUNNER_TEMP 'imprint-uninstaller.log'
          $process = Start-Process "$dest/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"") -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(120000)) { taskkill /PID $process.Id /T /F; throw 'Uninstall timed out' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Uninstall failed: $($process.ExitCode)" }
          if (-not $server.WaitForExit(1000)) { $server.Kill(); throw 'Uninstall left an Imprint process running' }
          # Inno removes its own uninstaller files just after it exits.
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $dest) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dest) {
            Get-ChildItem -LiteralPath $dest -Recurse -Force | Select-Object -First 20 FullName | Out-Host
            throw 'Uninstall left files behind'
          }
          if (Test-Path $desktopProfile) { throw 'Uninstall left the desktop profile behind' }
          $config = Get-Content "$env:CODEX_HOME/config.toml" -Raw
          if ($config -match 'mcp_servers.imprint' -or $config -notmatch 'keep-other') { throw 'MCP cleanup failed' }
          $rules = Get-Content "$env:CODEX_HOME/AGENTS.md" -Raw
          if ($rules -match 'imprint:begin' -or $rules -notmatch 'Keep my rules') { throw 'Rule cleanup failed' }
          $hooks = Get-Content "$env:CODEX_HOME/hooks.json" -Raw
          if ($hooks -match 'hook_entry' -or $hooks -notmatch 'keep-hook') { throw 'Hook cleanup failed' }
      - name: Preserve Windows install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-logs
          path: |
            ${{ runner.temp }}/imprint-installer.log
            ${{ runner.temp }}/imprint-uninstaller.log
            ${{ runner.temp }}/Imprint install smoke/uninstall-cleanup.log
            ${{ runner.temp }}/Imprint install smoke/first-run.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/imprint-windows-amd64-setup.exe
          if-no-files-found: error

  package-macos:
    needs: archives
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon only: Intel Macs are not supported (ADR 0111).
        include:
          - arch: arm64
            runner: [self-hosted, macOS, ARM64, imprint-apple-silicon]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/
      - name: Extract archive
        env:
          ARCH: ${{ matrix.arch }}
        run: tar -xzf "dist/imprint-darwin-${ARCH}.tar.gz" -C dist

      - name: Install librsvg (for icon rendering)
        run: command -v rsvg-convert >/dev/null || brew install librsvg

      - name: Build .pkg
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          OUT="dist/imprint-darwin-${ARCH}.pkg"
          ./installers/macos/build-pkg.sh \
            --version "$VER" \
            --arch "$ARCH" \
            --source "dist/imprint-darwin-${ARCH}" \
            --out    "$OUT"
          ls -la "$OUT"

      - name: Validate package payload
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          EXPANDED="$RUNNER_TEMP/imprint-pkg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pkgutil --expand-full "dist/imprint-darwin-${ARCH}.pkg" "$EXPANDED"
          trap 'rm -rf "$EXPANDED"' EXIT
          APP=$(find "$EXPANDED" -type d -name Imprint.app -print -quit)
          test -n "$APP"
          test -x "$APP/Contents/MacOS/imprint-setup-helper"
          # The validator imports imprint modules, which need Python 3.11+. The
          # runner VM's Homebrew python@3.12 is baked into its image; setup-python's
          # macOS build needs /Users/runner.
          python3.12 scripts/validate-release.py "$APP/Contents/Resources/imprint" "darwin/$ARCH"

      - name: Smoke test native package and writable runtime
        # The Apple silicon runner is a disposable VM per job (ADR 0115).
        timeout-minutes: 60
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Never install into a persistent machine's /Applications.
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ] && [ "${IMPRINT_DISPOSABLE_RUNNER:-}" != 1 ]; then
            echo "::error::refusing to install the package on a persistent self-hosted runner"
            exit 1
          fi
          sudo installer -pkg "dist/imprint-darwin-${ARCH}.pkg" -target /
          ROOT=/Applications/Imprint.app/Contents/Resources/imprint
          "$ROOT/bin/imprint" bootstrap --profile cpu --non-interactive
          PYTHONPATH="$ROOT" "$HOME/.local/share/imprint/.venv/bin/python" scripts/smoke-runtime.py --with-embeddings
          test -x /Applications/Imprint.app/Contents/MacOS/imprint-setup-helper
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.arch }}
          path: dist/imprint-darwin-${{ matrix.arch }}.pkg
          if-no-files-found: error

  smoke-linux:
    needs: archives
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: [self-hosted, linux, x64]
          - arch: arm64
            runner: [imprint-arm64]
    runs-on: ${{ matrix.runner }}
    # arm64 runs under qemu-user emulation, several times slower (ADR 0112).
    timeout-minutes: ${{ matrix.arch == 'arm64' && 90 || 60 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/
      - name: Bootstrap extracted release without host Python
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tar -xzf "dist/imprint-linux-${ARCH}.tar.gz" -C dist
          ROOT="$PWD/dist/imprint-linux-${ARCH}"
          "$ROOT/bin/imprint" bootstrap --profile cpu --non-interactive
          PYTHONPATH="$ROOT" "$ROOT/.venv/bin/python" scripts/smoke-runtime.py --with-embeddings


  publish:
    needs: [archives, package-windows, package-macos, smoke-linux, chrome-extension]
    if: inputs.publish
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-archives
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: chrome-extension
          path: dist/
      - name: Check complete asset set and checksum every deliverable
        working-directory: dist
        run: |
          set -euo pipefail
          for asset in imprint-linux-amd64.tar.gz imprint-linux-arm64.tar.gz \
            imprint-darwin-arm64.tar.gz \
            imprint-windows-amd64.zip imprint-windows-amd64-setup.exe \
            imprint-darwin-arm64.pkg \
            imprint-chrome-extension.zip; do
            test -s "$asset"
          done
          sha256sum *.tar.gz *.zip *.exe *.pkg > SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$PRERELEASE" = true ]; then FLAGS+=(--prerelease); fi
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes "${FLAGS[@]}" dist/*
