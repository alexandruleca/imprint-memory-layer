name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o build/ .
      - run: python -m pip install --require-hashes -r requirements/base.lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: MCP, dashboard and native Qdrant smoke
        env:
          PYTHONPATH: .
        run: python scripts/smoke-runtime.py --with-storage

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ui-electron/navigation.test.js
      - run: make dashboard-build
      - run: npm run lint
        working-directory: imprint/ui
      - run: npx playwright install --with-deps chromium
        working-directory: imprint/ui
      - run: npm run test:e2e
        working-directory: imprint/ui
      - name: Build Linux Electron app
        run: make ui-dist-linux ARCH=amd64
      - name: Verify preload and navigation ship in the Electron archive
        run: |
          node ui-electron/node_modules/@electron/asar/bin/asar.js list dist/electron/linux-unpacked/resources/app.asar > /tmp/asar-files
          grep -Fx /preload.js /tmp/asar-files
          grep -Fx /navigation.js /tmp/asar-files

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.imprint -t imprint-ci:local .
      - run: bash scripts/smoke-container.sh imprint-ci:local

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint -shellcheck=''
