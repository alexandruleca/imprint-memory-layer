name: CI

on:
  push:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    # arm64 runs under qemu-user emulation, several times slower (ADR 0112).
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04-arm' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        # PR code runs only in throwaway containers, so pull requests skip the
        # Windows VMs and the laptop (ADR 0112). Intel macOS is not supported
        # (ADR 0111).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "ubuntu-24.04-arm"]' || '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest"]') }}
    runs-on: >-
      ${{ fromJSON(github.event_name == 'pull_request' && '{"ubuntu-latest": ["imprint-pr"], "ubuntu-24.04-arm": ["imprint-arm64"]}' || '{"ubuntu-latest": ["self-hosted", "linux", "x64"], "ubuntu-24.04-arm": ["imprint-arm64"], "windows-latest": ["self-hosted", "windows", "x64", "imprint-windows"], "macos-latest": ["self-hosted", "macOS", "ARM64", "imprint-apple-silicon"]}')[matrix.os] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The macOS runner is a fresh VM every job (ADR 0115), so it caches too.
      - name: Isolated Python on the laptop
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3.12 -m venv "$RUNNER_TEMP/imprint-python"
          echo "$RUNNER_TEMP/imprint-python/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/imprint-python" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ui-electron/*.test.js
      - run: node --test extensions/chrome/tests/*.test.js
      - run: go vet ./...
      - run: go test ./...
      - name: Windows PowerShell setup regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-setup.ps1
      - name: Windows uninstall cleanup regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-uninstall.ps1
      - name: Windows desktop launcher regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-launcher.ps1
      - run: go build -o build/ .
      - run: python -m pip install --require-hashes -r requirements/base.lock.txt -r requirements/cpu.lock.txt -r requirements/llm.lock.txt
      - name: PersonaPlex adapter test dependencies (not a runtime profile)
        run: python -m pip install --require-hashes -r requirements/personaplex-test.lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      # The dashboard static export is not tracked; the smoke serves it.
      - name: Dashboard static export
        run: |
          npm ci --prefix imprint/ui
          npm run build --prefix imprint/ui
      - name: MCP, dashboard and native Qdrant smoke
        env:
          PYTHONPATH: .
        run: python scripts/smoke-runtime.py --with-storage

  frontend:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["imprint-pr"]' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ui-electron/*.test.js
      - run: node --test site/scripts/build-benchmarks.test.mjs
      - run: node --test site/scripts/doc-links.test.mjs
      - run: node --test site/scripts/chrome-extension.test.mjs
      - run: make dashboard-build
      - run: npm run lint
        working-directory: imprint/ui
      # The self-hosted runner images lack Chromium's runtime libraries
      # (libnspr4 and others), which hosted Ubuntu preinstalled (ADR 0112).
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 60
        working-directory: imprint/ui
      - run: node extensions/chrome/tests/browser-smoke.mjs
      - run: npm run test:e2e
        working-directory: imprint/ui

  container:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify relay runs as non-root and serves health
        shell: bash
        run: |
          set -euo pipefail
          docker build -t imprint-relay-ci .
          docker run --rm -d --name imprint-relay-ci -p 127.0.0.1:8430:8430 imprint-relay-ci
          trap 'docker rm -f imprint-relay-ci' EXIT
          test "$(docker exec imprint-relay-ci id -u)" != 0
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8430/health
      - run: docker build -f Dockerfile.imprint -t imprint-ci:local .
      - run: bash scripts/smoke-container.sh imprint-ci:local

  workflows:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["imprint-pr"]' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint -shellcheck=''
      - name: Release version history regression
        run: python3 scripts/test-release-versioning.py
