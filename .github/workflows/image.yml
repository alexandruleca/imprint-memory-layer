name: Image

on:
  # Images follow stable releases only: dev prereleases publish none (ADR 0066).
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build (e.g. v1.2.3 or v1.2.3-dev.4). Defaults to latest matching channel."
        required: false
      channel:
        description: "Channel for floating tag"
        required: false
        default: "stable"
        type: choice
        options: [stable, dev]

concurrency:
  group: image-${{ github.event.workflow_run.name || inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    # Skip if the triggering release run failed. Always run on manual dispatch.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: [self-hosted, linux, x64]
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Determine channel
        id: channel
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CHANNEL=stable
          else
            CHANNEL="${INPUT_CHANNEL:-stable}"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL"

      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "$CHANNEL" = "dev" ]; then
            VERSION=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$' | head -1 || true)
          else
            VERSION=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          fi

          if [ -z "$VERSION" ]; then
            echo "No matching tag found for channel=$CHANNEL. Nothing to build."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "major_minor=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: $VERSION"

      - name: Require source merged into main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        if: steps.version.outputs.version != ''
        run: git merge-base --is-ancestor "$VERSION" origin/main

  # The imprint image's base (Dockerfile.base) changes only with its inputs,
  # which its tag hashes: a release reuses it, and only a new base is built.
  base:
    needs: resolve
    if: needs.resolve.outputs.version != ''
    runs-on: [self-hosted, linux, x64]
    # A new base installs the arm64 dependencies under qemu emulation (ADR 0112).
    timeout-minutes: 90
    outputs:
      image: ${{ steps.base.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source at tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: git checkout "$VERSION"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the base image
        id: base
        run: |
          set -euo pipefail
          if [ ! -f Dockerfile.base ]; then
            echo "This release predates the base image; its Dockerfile installs everything"
            exit 0
          fi
          image=$(scripts/base-image-tag.sh)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Reusing $image"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $image"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup QEMU
        if: steps.base.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        if: steps.base.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push the base image
        if: steps.base.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.base.outputs.image }}

  # Lightweight sync relay — Go binary only, stateless. It is built and
  # deployed on its own, never waiting for the imprint image.
  build-relay:
    needs: resolve
    if: needs.resolve.outputs.version != ''
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source at tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: git checkout "$VERSION"

      - name: Compute image tags
        id: tags
        env:
          IMAGE: ghcr.io/alexandruleca/imprint-relay
          VERSION: ${{ needs.resolve.outputs.version }}
          MAJOR_MINOR: ${{ needs.resolve.outputs.major_minor }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          TAGS="${IMAGE}:${VERSION}"
          if [ "$CHANNEL" = "dev" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:dev"
          else
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
            if [ -n "${MAJOR_MINOR:-}" ]; then
              TAGS="${TAGS}"$'\n'"${IMAGE}:${MAJOR_MINOR}"
            fi
          fi
          {
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay

  # Full Imprint runtime — Go CLI + Python + dashboard UI + auto-Qdrant —
  # on its base image.
  build-imprint:
    needs: [resolve, base]
    if: needs.resolve.outputs.version != ''
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source at tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: git checkout "$VERSION"

      - name: Compute image tags
        id: tags
        env:
          IMAGE: ghcr.io/alexandruleca/imprint
          VERSION: ${{ needs.resolve.outputs.version }}
          MAJOR_MINOR: ${{ needs.resolve.outputs.major_minor }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          TAGS="${IMAGE}:${VERSION}"
          if [ "$CHANNEL" = "dev" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:dev"
          else
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
            if [ -n "${MAJOR_MINOR:-}" ]; then
              TAGS="${TAGS}"$'\n'"${IMAGE}:${MAJOR_MINOR}"
            fi
          fi
          {
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the imprint image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.imprint
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            BASE_IMAGE=${{ needs.base.outputs.image }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=imprint
          cache-to: type=gha,mode=max,scope=imprint

  # The public relay runs the relay image's `latest` tag. Its Portainer service
  # webhook (secret RELAY_DEPLOY_WEBHOOK) re-pulls that tag; Swarm starts the
  # new relay before stopping the old one and rolls back if it never turns
  # healthy. The job ends when the relay reports the release.
  deploy-relay:
    needs: [resolve, build-relay]
    if: needs.resolve.outputs.channel == 'stable'
    runs-on: [self-hosted, linux, x64]
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      RELAY_URL: https://sync.alexandruleca.com
    steps:
      - name: Redeploy the public relay
        env:
          WEBHOOK: ${{ secrets.RELAY_DEPLOY_WEBHOOK }}
        run: |
          test -n "$WEBHOOK" || { echo "RELAY_DEPLOY_WEBHOOK is not set"; exit 1; }
          curl --fail --silent --show-error -X POST "$WEBHOOK"

      - name: Wait for the relay to run ${{ needs.resolve.outputs.version }}
        run: |
          for _ in $(seq 30); do
            running=$(curl --fail --silent "$RELAY_URL/health" | jq -r .version) || running=
            if [ "$running" = "$VERSION" ]; then echo "The relay runs $VERSION"; exit 0; fi
            sleep 10
          done
          echo "After 5 minutes the relay reports '${running:-nothing}', not $VERSION"
          exit 1
