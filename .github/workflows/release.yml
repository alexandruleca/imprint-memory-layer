name: Release

# main publishes stable releases; dev publishes prereleases of the next stable
# version through the same build (ADR 0066).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force version bump (overrides commit analysis)"
        required: false
        default: "auto"
        type: choice
        options: [auto, patch, minor, major]

# A newer dev push supersedes a dev build in progress; a stable release always
# finishes. Each branch has its own group, so neither queues behind the other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

permissions:
  contents: write

jobs:
  # A push builds a release only once CI has passed on the same commit, so a
  # failing commit is never released and the two workflows do not load the
  # runners at once. Release stays its own run because Image and Pages follow
  # it through workflow_run. A manual dispatch is not gated.
  ci:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180
    permissions:
      actions: read
    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA"
          while true; do
            # Newest first; a rerun keeps its run and updates its status.
            state=$(gh api "$runs" --jq '.workflow_runs[0] // {} | "\(.status // "missing") \(.conclusion // "")"')
            case "$state" in
              "completed success") echo "CI passed on $GITHUB_SHA"; exit 0 ;;
              completed*)
                echo "::error::CI ${state#completed } on $GITHUB_SHA; rerun this job once CI passes"
                exit 1 ;;
            esac
            echo "CI: $state"
            sleep 60
          done

  analyze:
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    runs-on: [self-hosted, linux, x64]
    outputs:
      version: ${{ steps.compute.outputs.version }}
      bump: ${{ steps.compute.outputs.bump }}
      major_minor: ${{ steps.compute.outputs.major_minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: compute
        env:
          FORCE_BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail

          # A commit main already holds is released from main (or was found
          # not releasable there); dev does not build it a second time.
          if [ "$GITHUB_REF" = refs/heads/dev ] && git merge-base --is-ancestor HEAD origin/main; then
            echo "Analysis: $(git rev-parse --short HEAD) is already on main; its release comes from main"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)

          if [ -z "$LAST" ]; then
            LAST_SEMVER="0.0.0"
            RANGE_ARGS=()
          else
            LAST_SEMVER="${LAST#v}"
            RANGE_ARGS=("${LAST}..HEAD")
          fi

          HAS_MAJOR=0; HAS_MINOR=0; HAS_PATCH=0

          # Iterate commit messages (subject + body per commit, NUL-separated)
          while IFS= read -r -d '' commit; do
            [ -z "$commit" ] && continue
            SUBJECT=$(printf '%s' "$commit" | head -n1)
            # Breaking change: "feat!:", "fix(scope)!:", or "BREAKING CHANGE:" in body
            if printf '%s\n' "$SUBJECT" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
              HAS_MAJOR=1; continue
            fi
            if printf '%s\n' "$commit" | grep -qE '^BREAKING[ -]CHANGE:'; then
              HAS_MAJOR=1; continue
            fi
            # feat → minor
            if printf '%s\n' "$SUBJECT" | grep -qE '^feat(\([^)]+\))?:'; then
              HAS_MINOR=1; continue
            fi
            # fix, perf → patch
            if printf '%s\n' "$SUBJECT" | grep -qE '^(fix|perf)(\([^)]+\))?:'; then
              HAS_PATCH=1; continue
            fi
          done < <(git log "${RANGE_ARGS[@]}" --format='%B' -z)

          if [ "${FORCE_BUMP:-auto}" != "auto" ] && [ -n "${FORCE_BUMP:-}" ]; then
            BUMP="$FORCE_BUMP"
          elif [ "$HAS_MAJOR" = 1 ]; then
            BUMP=major
          elif [ "$HAS_MINOR" = 1 ]; then
            BUMP=minor
          elif [ "$HAS_PATCH" = 1 ]; then
            BUMP=patch
          else
            BUMP=none
          fi

          IFS='.' read -r MAJ MIN PAT <<< "$LAST_SEMVER"

          if [ -z "$LAST" ] && [ "$BUMP" != "none" ]; then
            NEW="0.1.0"
          else
            case "$BUMP" in
              major) NEW="$((MAJ+1)).0.0" ;;
              minor) NEW="${MAJ}.$((MIN+1)).0" ;;
              patch) NEW="${MAJ}.${MIN}.$((PAT+1))" ;;
              none)  NEW="" ;;
            esac
          fi

          # A dev build is the Nth prerelease of the version main would release.
          if [ -n "$NEW" ] && [ "$GITHUB_REF" = refs/heads/dev ]; then
            BUILD=$(git tag --list "v${NEW}-dev.*" | sed 's/.*-dev\.//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
            NEW="${NEW}-dev.$(( ${BUILD:-0} + 1 ))"
          fi

          echo "Analysis: last=$LAST bump=$BUMP next=${NEW:-<skip>}"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          if [ -n "$NEW" ]; then
            IFS='.' read -r NM NN _ <<< "$NEW"
            echo "version=v$NEW" >> "$GITHUB_OUTPUT"
            echo "major_minor=v${NM}.${NN}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "major_minor=" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    needs: analyze
    if: needs.analyze.outputs.version != ''
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.analyze.outputs.version }}
      prerelease: ${{ github.ref == 'refs/heads/dev' }}
      publish: true
    secrets: inherit
