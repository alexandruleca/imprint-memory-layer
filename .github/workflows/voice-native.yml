name: Native voice

on:
  workflow_dispatch:
  push:
    branches: [feat/local-voice-avatar, feat/echo-desktop-refinement]
    paths:
      - 'imprint/voice*.py'
      - 'imprint/lfm_audio.py'
      - 'scripts/smoke-live-voice.py'
      - 'scripts/smoke-voice-desktop.py'
      - 'ui-electron/**'
      - 'imprint/ui/src/components/companion-toggle.tsx'
      - 'imprint/ui/src/components/echo-avatar.tsx'
      - 'imprint/ui/src/components/voice-*.tsx'
      - 'imprint/ui/src/lib/voice-*.ts'
      - 'imprint/ui/src/lib/echo-canvas-renderer.ts'
      - 'imprint/ui/src/styles/voice.css'
      - 'imprint/ui/src/app/launcher/**'
      - 'imprint/ui/public/models/**'
      - '.github/workflows/voice-engine.yml'
      - 'tests/test_voice*.py'
      - '.github/workflows/voice-native.yml'

permissions:
  contents: read

concurrency:
  group: voice-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundles:
    uses: ./.github/workflows/voice-engine.yml

  speech:
    needs: bundles
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Select external voice cache
        shell: bash
        run: echo "VOICE_CACHE=$RUNNER_TEMP/imprint-voice" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/base.lock.txt
            requirements/cpu.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements/base.lock.txt -r requirements/cpu.lock.txt
      - name: Select native bundle
        shell: bash
        run: python -c "from imprint.voice_runtime import target; print('VOICE_TARGET=' + target())" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: voice-engine-${{ env.VOICE_TARGET }}
          path: imprint/voice-engine/
      - name: Restore bundle executable permission
        if: runner.os != 'Windows'
        shell: bash
        run: python -c "from imprint.voice_runtime import native_binary; from pathlib import Path; native_binary(Path('imprint/voice-engine')).chmod(0o755)"
      - name: Voice regressions
        run: python -m unittest discover -s tests -p "test_voice*.py" -v
      - name: Restore portable model weights
        id: weights-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VOICE_CACHE }}/*.gguf
          key: lfm-voice-q4-7d525f883a077e20afb782f2ff618edcae0e39e4
      - name: Install and verify bundled engine with portable weights
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from imprint.voice_bundle import install
          from imprint.voice_runtime import verify
          root = Path(os.environ['VOICE_CACHE'])
          install(root)
          verify(root)
          PY
      - name: Save verified weights before graphical checks
        if: steps.weights-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VOICE_CACHE }}/*.gguf
          key: lfm-voice-q4-7d525f883a077e20afb782f2ff618edcae0e39e4
      - name: Verify idempotent bundled setup
        shell: bash
        run: python -c "from imprint.voice_bundle import install; from pathlib import Path; import os; install(Path(os.environ['VOICE_CACHE']))"
      - name: Exercise real speech, transport and cancellation
        shell: bash
        run: python scripts/smoke-live-voice.py --runtime-dir "$VOICE_CACHE" --output-dir "$RUNNER_TEMP/voice-evidence" --native-logs
      - name: Build desktop UI and install Electron
        shell: bash
        run: |
          npm ci --prefix imprint/ui
          npm run build --prefix imprint/ui
          npm ci --prefix ui-electron
          node ui-electron/node_modules/electron/install.js
      - name: Native transparent companion and dashboard toggle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node ui-electron/smoke-microphone.mjs
            xvfb-run -a node ui-electron/smoke-companion-controls.mjs imprint/ui/out "$RUNNER_TEMP/voice-controls"
            xvfb-run -a python scripts/smoke-voice-desktop.py --runtime-dir "$VOICE_CACHE" --output-dir "$RUNNER_TEMP/voice-desktop" --native-logs --bundled-setup
          else
            node ui-electron/smoke-microphone.mjs
            node ui-electron/smoke-companion-controls.mjs imprint/ui/out "$RUNNER_TEMP/voice-controls"
            python scripts/smoke-voice-desktop.py --runtime-dir "$VOICE_CACHE" --output-dir "$RUNNER_TEMP/voice-desktop" --native-logs --bundled-setup
          fi
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/voice-evidence/
            ${{ env.VOICE_CACHE }}/live-build.json
            ${{ runner.temp }}/voice-desktop/
            ${{ runner.temp }}/voice-controls/
          if-no-files-found: warn
