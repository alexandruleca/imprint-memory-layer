name: Native voice

on:
  workflow_dispatch:
  push:
    branches: [feat/local-voice-avatar]
    paths:
      - 'imprint/voice*.py'
      - 'imprint/lfm_audio.py'
      - 'scripts/smoke-live-voice.py'
      - 'scripts/smoke-voice-desktop.py'
      - 'ui-electron/**'
      - 'imprint/ui/src/components/companion-toggle.tsx'
      - 'imprint/ui/src/styles/voice.css'
      - 'tests/test_voice.py'
      - '.github/workflows/voice-native.yml'

permissions:
  contents: read

concurrency:
  group: voice-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speech:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Select external voice cache
        shell: bash
        run: echo "VOICE_CACHE=$RUNNER_TEMP/imprint-voice" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/base.lock.txt
            requirements/cpu.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements/base.lock.txt -r requirements/cpu.lock.txt
      - name: Configure native Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Voice regressions
        run: python -m unittest discover -s tests -p test_voice.py -v
      - name: Restore verified native worker cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.VOICE_CACHE }}/live-source.tar.gz
            ${{ env.VOICE_CACHE }}/live-build.json
            ${{ env.VOICE_CACHE }}/live-native
          key: voice-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('imprint/voice_runtime.py', 'requirements/runtime-manifest.json') }}
      - name: Restore portable model weights
        uses: actions/cache@v4
        with:
          path: ${{ env.VOICE_CACHE }}/*.gguf
          key: lfm-voice-q4-7d525f883a077e20afb782f2ff618edcae0e39e4
      - name: Build verified private native worker
        shell: bash
        run: python -m imprint.voice_runtime --runtime-dir "$VOICE_CACHE" --jobs 4
      - name: Cache verified native build
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.VOICE_CACHE }}/live-source.tar.gz
            ${{ env.VOICE_CACHE }}/live-build.json
            ${{ env.VOICE_CACHE }}/live-native
          key: voice-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('imprint/voice_runtime.py', 'requirements/runtime-manifest.json') }}
      - name: Verify idempotent build
        shell: bash
        run: python -m imprint.voice_runtime --runtime-dir "$VOICE_CACHE" --jobs 4
      - name: Exercise real speech, transport and cancellation
        shell: bash
        run: python scripts/smoke-live-voice.py --runtime-dir "$VOICE_CACHE" --output-dir "$RUNNER_TEMP/voice-evidence" --native-logs
      - name: Build desktop UI and install Electron
        shell: bash
        run: |
          npm ci --prefix imprint/ui
          npm run build --prefix imprint/ui
          npm ci --prefix ui-electron
          node ui-electron/node_modules/electron/install.js
      - name: Native transparent companion and dashboard toggle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python scripts/smoke-voice-desktop.py --runtime-dir "$VOICE_CACHE" --output-dir "$RUNNER_TEMP/voice-desktop"
          else
            python scripts/smoke-voice-desktop.py --runtime-dir "$VOICE_CACHE" --output-dir "$RUNNER_TEMP/voice-desktop"
          fi
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/voice-evidence/
            ${{ env.VOICE_CACHE }}/live-build.json
            ${{ runner.temp }}/voice-desktop/
          if-no-files-found: warn
